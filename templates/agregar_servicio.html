{% extends "base.html" %}
{% block content %}
<h2>Agregar Servicio para {{ moto.marca }} {{ moto.modelo }}</h2>
<form method="POST">
    Descripción: <input type="text" name="descripcion"><br>
    Fecha: <input type="text" name="fecha"><br>
    Costo: <input type="number" step="0.01" name="costo"><br>
    <input type="submit" value="Guardar">
</form>
{% endblock %}
