<!-- Formulario de presupuesto -->
<form method="POST" action="/agregar_presupuesto/{{ moto.id }}" id="formPresupuesto">
    <label>Producto o Servicio:</label>
    <input type="text" id="producto" name="producto" required autocomplete="off" placeholder="Buscar producto o servicio...">
    <div id="sugerencias" style="border:1px solid #ccc; display:none; position:absolute; background:#fff; max-height:200px; overflow-y:auto;"></div>

    <label>Cantidad:</label>
    <input type="number" name="cantidad" min="1" required>

    <label>Precio unitario:</label>
    <input type="number" id="precio_unitario" name="precio_unitario" step="0.01" required>

    <button type="submit">Agregar al carrito</button>
</form>

<!-- Modal emergente -->
<div id="modalNoExiste" style="display:none; position:fixed; top:30%; left:35%; background:#fff; border:1px solid #000; padding:20px; z-index:1000;">
    <p>El producto o servicio no existe en las listas.</p>
    <button id="btnAgregarLista">Agregar a lista</button>
    <button id="btnNoAgregar">No agregar</button>
</div>

<!-- Modal categoría -->
<div id="modalCategoria" style="display:none; position:fixed; top:30%; left:35%; background:#fff; border:1px solid #000; padding:20px; z-index:1000;">
    <p>¿Es un producto o un servicio?</p>
    <button onclick="seleccionarTipo('producto')">Producto</button>
    <button onclick="seleccionarTipo('servicio')">Servicio</button>
    <div id="categoriaForm" style="margin-top:10px; display:none;">
        <label>Categoría:</label>
        <input type="text" id="categoriaNueva">
        <button onclick="guardarEnLista()">Guardar</button>
    </div>
</div>

<script>
const formPresupuesto = document.getElementById("formPresupuesto");
const modalNoExiste = document.getElementById("modalNoExiste");
const modalCategoria = document.getElementById("modalCategoria");
let productoPendiente = null;

formPresupuesto.addEventListener("submit", function(e) {
    const precio = document.getElementById("precio_unitario").value;
    if (!precio) {
        e.preventDefault();
        modalNoExiste.style.display = "block";
        productoPendiente = document.getElementById("producto").value;
    }
});

document.getElementById("btnNoAgregar").onclick = function() {
    modalNoExiste.style.display = "none";
    formPresupuesto.submit(); // agrega normalmente a la tabla
};

document.getElementById("btnAgregarLista").onclick = function() {
    modalNoExiste.style.display = "none";
    modalCategoria.style.display = "block";
};

function seleccionarTipo(tipo) {
    document.getElementById("categoriaForm").style.display = "block";
    modalCategoria.dataset.tipo = tipo;
}

function guardarEnLista() {
    const tipo = modalCategoria.dataset.tipo;
    const categoria = document.getElementById("categoriaNueva").value;
    modalCategoria.style.display = "none";

    // Aquí deberías hacer un fetch POST a tu backend para guardar en Inventario o Servicios
    fetch("/agregar_a_lista", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            nombre: productoPendiente,
            tipo: tipo,
            categoria: categoria
        })
    }).then(res => res.json())
      .then(data => alert("Agregado a lista correctamente"));

    // Luego se puede enviar el formulario normalmente
    formPresupuesto.submit();
}
</script>
